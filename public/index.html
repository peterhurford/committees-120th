<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Committees, 120th</title>
<style>:root{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a committee picker, summary tiles, then one "docket" per chamber; each pairs a 119th and a 120th hemicycle, then a seat ledger. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#18202c; --muted:#5b6575; --rule:#dde1e8;
  --d:#2f5fb3; --d-soft:#dbe5f6; --r:#c0392b; --r-soft:#f6dcd8; --warn:#b7791f; --warn-soft:#f8ecd6;
  --display:"Public Sans",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#181e27; --ink:#e7ebf1; --muted:#9aa4b3; --rule:#2a3240;
  --d:#6f9be6; --d-soft:#1f3150; --r:#e8705f; --r-soft:#4a2420; --warn:#e2a64a; --warn-soft:#3d2e14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#181e27; --ink:#e7ebf1; --muted:#9aa4b3; --rule:#2a3240;
  --d:#6f9be6; --d-soft:#1f3150; --r:#e8705f; --r-soft:#4a2420; --warn:#e2a64a; --warn-soft:#3d2e14; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
p{margin:0;max-width:68ch}
.lede{color:var(--muted);font-size:16px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.head{display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:4px}
.tile .big{font-family:var(--mono);font-size:26px;font-weight:500}
.tile .big .d{color:var(--d)} .tile .big .r{color:var(--r)}
.newd{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--d)}
.newd span{font-size:16px;font-weight:700;margin-left:4px}
.newcap{color:var(--d);font-weight:700;border:1px dashed var(--d);padding:1px 6px;border-radius:3px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--panel);font-size:13px;line-height:1.35;padding:7px 10px;border-radius:5px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{display:block;font-size:14px}
.seat{cursor:pointer}
.seat circle{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.seat:hover circle,.seat.on circle{transform:scale(1.35)}
.tile small{color:var(--muted);font-size:13px}
.docket{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px;display:grid;gap:20px}
.docket-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:baseline}
.charts{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.chart{display:grid;gap:6px;justify-items:center;min-width:0}
.chart svg{width:100%;max-width:420px;height:auto;display:block}
.chart .cap{font-family:var(--mono);font-size:13px;text-align:center}
.chart .cap b{font-family:var(--body);font-size:14px}
.arrow{color:var(--muted);font-size:28px}
@media (max-width:720px){.charts{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:14px;height:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.ledger{display:grid;gap:6px;min-width:0;align-content:start}
.ledger h3{padding-bottom:4px;border-bottom:2px solid var(--rule)}
.ledger.dem h3{border-color:var(--d)} .ledger.rep h3{border-color:var(--r)}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.row .rk{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .nm{min-width:0} .row .nm em{font-style:normal;color:var(--muted);font-size:12.5px;display:block;line-height:1.35}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;font-family:var(--mono)}
.chip.ret{color:var(--muted);border:1px solid var(--rule)}
.chip.leave{background:var(--ink);color:var(--panel)}
.chip.risk{background:var(--warn-soft);color:var(--warn)}
.chip.open{border:1px dashed currentColor}
.dem .chip.open{color:var(--d)} .rep .chip.open{color:var(--r)}
.row.left .nm>span{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.callouts{display:grid;gap:10px}
.callout{border-left:3px solid var(--warn);padding:2px 0 2px 12px}
.callout b{display:block}
.sources{font-size:13px;color:var(--muted);display:grid;gap:4px}
.sources a{color:var(--d)}
a:focus-visible,button:focus-visible{outline:2px solid var(--d);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.pick{display:flex;flex-wrap:wrap;min-width:0;max-width:100%;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pick select{font:600 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 34px 8px 12px;max-width:100%;min-width:0;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-transform:none;letter-spacing:0}
@media (max-width:720px){.pick{width:100%}.pick select{flex:1}}
.pick select:focus-visible{outline:2px solid var(--d);outline-offset:2px}
.chip.cut{background:var(--warn-soft);color:var(--warn)}
.chip.ex{color:var(--muted);border:1px dashed var(--rule)}
.basis{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <h1>Committees, 120th</h1>
    <label class="pick">Committee <select id="pick" aria-label="Committee"></select></label>
  </header>
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <div id="dockets" style="display:grid;gap:28px"></div>
</div>

<script src="data.js"></script>
<script>
// Each committee in data.js: {chamber:"S"|"H", name, D:[[name, state/district, kind, note]...], R:[...],
// chair120, ranking120, size120?:[D,R], callouts?, extraHtml?, sources?}. kind: ret | leave | risk.
// Notes of "Ex officio" sit outside the seat count. Without size120, the 120th keeps the 119th size and splits it
// at the chamber ratio (D 56/100 Senate, 264/435 House); if more members return than a party gets, the page shows seats cut, not who loses one.
const SHARE={S:56/100,H:264/435};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const isEx=m=>m[3]==="Ex officio";

function project(c){
  const D=c.D.filter(m=>!isEx(m)), R=c.R.filter(m=>!isEx(m)), size=D.length+R.length;
  let [d,r]=c.size120||(()=>{let d=Math.round(size*SHARE[c.chamber]);if(d<=size-d)d=Math.floor(size/2)+1;return [d,size-d];})();
  const keep=(list,n)=>{const ret=list.filter(m=>m[2]!=="leave").length;
    return {list,n,ret,open:Math.max(0,n-ret),cut:Math.max(0,ret-n),leave:list.length-ret};};
  return {d,r,size,D:keep(D,d),R:keep(R,r),exD:c.D.filter(isEx),exR:c.R.filter(isEx)};
}

const NS="http://www.w3.org/2000/svg";
function seatPositions(n){
  const rows = n<=16?2:n<=30?3:n<=48?4:5, r0=0.5, pos=[];
  const radii=[...Array(rows)].map((_,i)=>r0+(1-r0)*i/(rows-1));
  const tot=radii.reduce((a,b)=>a+b,0);
  let counts=radii.map(r=>Math.round(n*r/tot)), diff=n-counts.reduce((a,b)=>a+b,0);
  counts[rows-1]+=diff;
  radii.forEach((r,i)=>{const m=counts[i];for(let j=0;j<m;j++){const t=Math.PI*(m===1?.5:1-j/(m-1));pos.push({x:Math.cos(t)*r,y:Math.sin(t)*r,t});}});
  pos.sort((a,b)=>b.t-a.t || a.y-b.y);
  return {pos,rows};
}
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
// seat kinds: ret, risk, leave, open; party d/r
function drawHemi(svg, seats, center){
  const W=220,H=118,cx=110,cy=108,R=100;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const {pos,rows}=seatPositions(seats.length);
  const dot = Math.min(7.2, (R*(1-.5)/(rows-1))*0.42, 150/seats.length+2.2);
  seats.forEach((s,i)=>{
    const p=pos[i], x=cx+p.x*R, y=cy-p.y*R, col=`var(--${s.p})`;
    const g=el("g",{class:"seat",tabindex:"0","aria-label":s.label});
    const c=el("circle",{cx:x,cy:y,r:dot});
    if(s.k==="ret"){c.setAttribute("fill",col);}
    else if(s.k==="risk"){c.setAttribute("fill",col);c.setAttribute("stroke","var(--warn)");c.setAttribute("stroke-width",dot*.45);}
    else if(s.k==="leave"){c.setAttribute("fill",`var(--${s.p}-soft)`);c.setAttribute("stroke",col);c.setAttribute("stroke-width",1);}
    else {c.setAttribute("fill","var(--panel)");c.setAttribute("stroke",col);c.setAttribute("stroke-width",1.3);c.setAttribute("stroke-dasharray","2 1.6");}
    g.appendChild(c);
    if(s.k==="leave"){const d=dot*.62;
      g.appendChild(el("line",{x1:x-d,y1:y+d,x2:x+d,y2:y-d,stroke:col,"stroke-width":1.4,"stroke-linecap":"round"}));}
    if(s.k==="risk"){const q=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central",fill:"#fff","font-weight":"800","font-size":dot*1.55,"font-family":"Public Sans, system-ui, sans-serif"});q.textContent="?";g.appendChild(q);}
    // larger invisible hit target so small seats are easy to hover and tap
    g.appendChild(el("circle",{cx:x,cy:y,r:dot*1.5,fill:"transparent"}));
    g.dataset.name=s.name; g.dataset.note=s.note;
    svg.appendChild(g);
  });
  const t=el("text",{x:cx,y:cy-4,"text-anchor":"middle",fill:center.color,"font-family":"Public Sans, system-ui, sans-serif","font-weight":"800","font-size":center.size||15});t.textContent=center.text;svg.appendChild(t);
  const u=el("text",{x:cx,y:cy+8,"text-anchor":"middle",fill:"var(--muted)","font-size":7.5,"font-family":"Public Sans, system-ui, sans-serif"});u.textContent=center.sub;svg.appendChild(u);
}
const KIND={ret:"Returns",risk:"Uncalled",leave:"Leaves"};
function seatsFor(P, chamber, which){
  const toSeat=(m,p)=>({p,k:m[2],name:`${m[0]} (${p.toUpperCase()}-${m[1]})`,note:[KIND[m[2]],m[3]].filter(Boolean).join(" · "),label:`${m[0]} (${m[1]})${m[3]?" · "+m[3]:""}`});
  const order={ret:0,risk:1,leave:2,open:2};
  let d=P.D.list.map(m=>toSeat(m,"d")), r=P.R.list.map(m=>toSeat(m,"r"));
  if(which==="120"){
    d=d.filter(s=>s.k!=="leave"); r=r.filter(s=>s.k!=="leave");
    // more returning members than seats: draw anonymous seats, since leadership picks who stays
    const pool=(side,seats,p,word)=>side.cut?Array.from({length:side.n},()=>({p,k:"ret",name:`${word} seat`,note:`${side.ret} returning ${word}s for ${side.n} seats; leadership picks who stays`,label:`${word} seat`})):seats;
    d=pool(P.D,d,"d","Democrat"); r=pool(P.R,r,"r","Republican");
    const how=chamber==="S"?"the Senate Democratic Steering Committee":"the Democratic Steering and Policy Committee";
    for(let i=0;i<P.D.open;i++) d.push({p:"d",k:"open",name:"New Democratic seat",note:`Filled by ${how} in January`,label:"New Democratic seat"});
    for(let i=0;i<P.R.open;i++) r.push({p:"r",k:"open",name:"New Republican seat",note:"",label:"New Republican seat"});
  }
  d.sort((a,b)=>order[a.k]-order[b.k]); r.sort((a,b)=>order[b.k]-order[a.k]);
  return [...d,...r];
}
const CHIP={ret:'<span class="chip ret">Returns</span>',leave:'<span class="chip leave">Leaves</span>',risk:'<span class="chip risk">Uncalled ?</span>'};
function ledger(side, ex, title){
  let h=`<h3>${title} · ${side.list.length} now · ${side.leave} leaving${side.cut?` · ${side.cut} seat${side.cut===1?"":"s"} cut`:""} · ${side.open} new</h3>`;
  side.list.forEach((m,i)=>{
    h+=`<div class="row ${m[2]==="leave"?"left":""}"><span class="rk">${i+1}</span><span class="nm"><span>${esc(m[0])}</span> <span class="mono" style="font-size:12px;color:var(--muted)">${esc(m[1])}</span>${m[3]?`<em>${esc(m[3])}</em>`:""}</span>${CHIP[m[2]]}</div>`;
  });
  if(side.cut>0) h+=`<div class="row"><span class="rk">−</span><span class="nm"><span>${side.cut} seat${side.cut===1?"":"s"} cut</span><em>${side.ret} returning members for ${side.n} seats; leadership picks who stays</em></span><span class="chip cut">Cut</span></div>`;
  if(side.open>0) h+=`<div class="row"><span class="rk">+</span><span class="nm"><span>${side.open} new seat${side.open===1?"":"s"}</span></span><span class="chip open">Open</span></div>`;
  ex.forEach(m=>{h+=`<div class="row ${m[2]==="leave"?"left":""}"><span class="rk">·</span><span class="nm"><span>${esc(m[0])}</span> <span class="mono" style="font-size:12px;color:var(--muted)">${esc(m[1])}</span><em>Ex officio, outside the seat count</em></span><span class="chip ex">Ex officio</span></div>`;});
  return h;
}
function legend(){
  const it=[["ret","Returns"],["risk","Uncalled"],["leave","Leaves"],["open","New slot"]];
  return it.map(([k,l])=>{
    const s = k==="ret"?'<circle cx="7" cy="7" r="5.5" fill="var(--muted)"/>':
      k==="risk"?'<circle cx="7" cy="7" r="5" fill="var(--muted)" stroke="var(--warn)" stroke-width="2.2"/><text x="7" y="7.4" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="7.5" font-weight="800">?</text>':
      k==="leave"?'<circle cx="7" cy="7" r="5.5" fill="var(--rule)" stroke="var(--muted)"/><line x1="3.5" y1="10.5" x2="10.5" y2="3.5" stroke="var(--muted)" stroke-width="1.4"/>':
      '<circle cx="7" cy="7" r="5.5" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="2 1.6"/>';
    return `<span><svg viewBox="0 0 14 14">${s}</svg>${l}</span>`;}).join("")+'<span>Hover or tap any seat for the member</span>';
}
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
function tile(c,P){
  const r119=`<span class="r">${P.R.list.length}R</span>–<span class="d">${P.D.list.length}D</span>`, r120=`<span class="d">${P.d}D</span>–<span class="r">${P.r}R</span>`;
  const rTail=P.R.cut?`${plural(P.R.cut,"Republican seat")} cut; leadership picks who goes.`:P.R.open?`${P.R.open} new Republican${P.R.open===1?"":"s"}.`:"No Republican seat is cut.";
  return `<div class="tile"><h3>${esc(c.short)}</h3><div class="newd">+${P.D.open} <span>new Democrat${P.D.open===1?"":"s"}</span></div><div class="big">${r119} → ${r120}</div><small>${plural(P.D.leave,"Democrat")} and ${plural(P.R.leave,"Republican")} leave. ${rTail}</small></div>`;
}
function docket(c,P,id){
  const up=s=>esc(s).toUpperCase();
  return `<section class="docket" id="${id}">
    <div class="docket-head"><h2>${esc(c.name)}</h2><span class="eyebrow">CHAIR ${up(P.R.list[0][0])} → ${up(c.chair120)} · RANKING ${up(P.D.list[0][0])} → ${up(c.ranking120)}</span></div>
    <div class="charts">
      <figure class="chart" style="margin:0"><svg data-w="119" role="img" aria-label="119th ${esc(c.name)} seats"></svg><div class="cap"><b>119th today</b> · ${P.R.list.length}R–${P.D.list.length}D · ${P.size} seats</div></figure>
      <div class="arrow" aria-hidden="true">→</div>
      <figure class="chart" style="margin:0"><svg data-w="120" role="img" aria-label="Projected 120th ${esc(c.name)} seats"></svg><div class="cap"><b>120th projected</b> · ${P.d}D–${P.r}R · <span class="newcap">${P.D.open} new D</span></div></figure>
    </div>
    <div class="legend">${legend()}</div>
    ${c.size120?"":`<p class="basis">The 120th split assumes the committee keeps its ${P.size} seats and tracks the chamber ratio; parties set the real ratio in January.</p>`}
    <div class="cols"><div class="ledger dem">${ledger(P.D,P.exD,"Democrats")}</div><div class="ledger rep">${ledger(P.R,P.exR,"Republicans")}</div></div>
    ${c.callouts&&c.callouts.length?`<div class="callouts">${c.callouts.map(x=>`<div class="callout">${esc(x)}</div>`).join("")}</div>`:""}
    ${c.extraHtml||""}
    ${c.sources&&c.sources.length?`<div class="sources">Sources: ${c.sources.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join(" · ")}</div>`:""}
  </section>`;
}

const pick=document.getElementById("pick");
pick.innerHTML=PAIRS.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join("");
function render(id){
  const pair=PAIRS.find(p=>p.id===id)||PAIRS[0];
  pick.value=pair.id;
  const parts=[pair.S,pair.H].filter(Boolean).map(k=>[k,COMMITTEES[k],project(COMMITTEES[k])]);
  document.getElementById("tiles").innerHTML=parts.map(([k,c,P])=>tile(c,P)).join("");
  const box=document.getElementById("dockets");
  box.innerHTML=parts.map(([k,c,P])=>docket(c,P,k)).join("");
  parts.forEach(([k,c,P])=>{
    const sec=document.getElementById(k);
    const R119=`${P.R.list.length}R–${P.D.list.length}D`, gone=[P.R.leave,P.D.leave];
    drawHemi(sec.querySelector('[data-w="119"]'),seatsFor(P,c.chamber,"119"),{text:R119,color:"var(--ink)",sub:`${gone[0]} R and ${gone[1]} D leave`});
    drawHemi(sec.querySelector('[data-w="120"]'),seatsFor(P,c.chamber,"120"),{text:`+${P.D.open} new D`,color:"var(--d)",size:14,sub:`${P.d}D–${P.r}R`});
  });
  document.title=pair.id==="commerce"?"Committees, 120th":`${pair.label} · Committees, 120th`;
}
pick.addEventListener("change",()=>{history.replaceState(null,"","#"+pick.value);render(pick.value);});
addEventListener("hashchange",()=>render(location.hash.slice(1)));
render(location.hash.slice(1));

const tip=document.createElement("div");tip.id="tip";tip.hidden=true;document.body.appendChild(tip);
let pinned=null;
function show(g,x,y){tip.innerHTML=`<b>${esc(g.dataset.name)}</b>${esc(g.dataset.note||"")}`;tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;let L=x+14,T=y-h-12;if(L+w>innerWidth-8)L=x-w-14;if(L<8)L=8;if(T<8)T=y+16;tip.style.left=L+"px";tip.style.top=T+"px";}
function hide(){tip.hidden=true;if(pinned){pinned.classList.remove("on");pinned=null;}}
const seatOf=e=>e.target.closest&&e.target.closest(".seat");
const box=document.getElementById("dockets");
box.addEventListener("pointerover",e=>{const g=seatOf(e);if(g&&e.pointerType==="mouse"&&!pinned)show(g,e.clientX,e.clientY)});
box.addEventListener("pointermove",e=>{const g=seatOf(e);if(g&&e.pointerType==="mouse"&&!pinned)show(g,e.clientX,e.clientY)});
box.addEventListener("pointerout",e=>{const g=seatOf(e);if(g&&e.pointerType==="mouse"&&!pinned&&!g.contains(e.relatedTarget))tip.hidden=true});
box.addEventListener("click",e=>{const g=seatOf(e);if(!g)return;e.stopPropagation();const was=pinned===g;hide();if(!was){pinned=g;g.classList.add("on");show(g,e.clientX,e.clientY);}});
box.addEventListener("focusin",e=>{const g=seatOf(e);if(g){const r=g.getBoundingClientRect();show(g,r.right,r.top)}});
box.addEventListener("focusout",e=>{if(seatOf(e)&&!pinned)tip.hidden=true});
document.addEventListener("click",hide);addEventListener("scroll",hide,{passive:true});
</script>
